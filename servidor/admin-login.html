<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración — Baruj Cosmetics</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="acceso-fondo">
  <main class="acceso">
    <div class="acceso__caja">
      <a class="marca marca--centro" href="/" aria-label="Baruj Cosmetics, ir al sitio">
        <svg class="marca__flor" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <g fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="16" cy="8" r="5"/><circle cx="23.5" cy="13.5" r="5"/>
            <circle cx="20.6" cy="22.4" r="5"/><circle cx="11.4" cy="22.4" r="5"/>
            <circle cx="8.5" cy="13.5" r="5"/><circle cx="16" cy="16" r="2.4" fill="currentColor"/>
          </g>
        </svg>
        <span class="marca__texto"><strong>BARUJ</strong><small>Cosmetics</small></span>
      </a>

      <h1>Administración</h1>
      <p class="acceso__texto">Ingresa el token de administrador para continuar.</p>

      {{ERROR}}

      <form class="acceso__form" method="post" action="/admin/login">
        <label for="token">Token de administrador</label>
        <input id="token" name="token" type="password" required
               autocomplete="current-password" autofocus spellcheck="false">
        <button class="boton boton--rosa" type="submit">Entrar</button>
      </form>

      <p class="acceso__nota">Acceso privado. Si no tienes el token, pídelo al administrador.</p>
      <a class="acceso__volver" href="/">Volver al sitio</a>
    </div>
  </main>
</body>
</html>
