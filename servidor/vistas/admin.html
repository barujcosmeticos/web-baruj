<!DOCTYPE html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administración — Baruj Cosmetics</title>
  <meta name="theme-color" content="{{COLOR}}">
  <link rel="icon" href="{{FAVICON}}" type="{{FAVICON_TIPO}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/admin.css">
  {{COLOR_CSS}}
</head>
<body class="admin-fondo">
  <header class="admin-barra">
    <div class="contenedor admin-barra__fila">
      <a class="marca" href="/" aria-label="Baruj Cosmetics, ir al sitio">
        {{SIMBOLO}}
        <span class="marca__texto"><strong>BARUJ</strong><small>Cosmetics</small></span>
      </a>
      <form method="post" action="/salir">
        <button class="boton boton--contorno boton--compacto" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </header>

  <main class="admin">
    <div class="contenedor">
      <h1>{{TITULO_ADMIN}}</h1>
      <p class="admin__texto">
        Administra la imagen del inicio y los usuarios de la tienda.
      </p>

      {{AVISO}}

      {{PANEL_BLOQUE}}
      {{HERO_BLOQUE}}
      {{USUARIOS_BLOQUE}}

      {{PIE_SESION}}
    </div>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
